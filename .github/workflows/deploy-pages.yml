name: Deploy to GitHub Pages

# Everything lives on main: pushes build the site and commit the output
# to docs/ on main itself. Pages serves main:/docs (Settings → Pages →
# Source: Deploy from a branch → main → /docs — one-time, admin-only).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build static Pages site
        run: npm run build:pages
      - name: Commit built site to docs/ on main
        run: |
          # docs/ holds the generated site; hand-written *.md files survive
          rsync -a --delete --exclude='*.md' --exclude='.gitkeep' dist/ docs/
          if git diff --quiet -- docs; then
            echo "site unchanged, nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Publish site to docs/ [skip ci]"
          # tolerate concurrent pushes to main
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
