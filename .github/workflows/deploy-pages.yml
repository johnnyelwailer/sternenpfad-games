name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Publish by force-pushing the built site to the gh-pages branch
# (classic branch-based Pages). The actions/deploy-pages API path
# proved unreliable for this site — deployments were accepted and then
# stuck in GitHub's queue until timeout.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build static Pages site
        run: npm run build:pages
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
      # Make sure the Pages site is configured to serve that branch —
      # fully automatic, no manual settings flip.
      - name: Point Pages at the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -s -o /tmp/pages.out -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" -d "$BODY")
          echo "update source -> HTTP $code"
          if [ "$code" = "404" ]; then
            code=$(curl -s -o /tmp/pages.out -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" -d "$BODY")
            echo "create site -> HTTP $code"
          fi
          cat /tmp/pages.out
          # request a fresh build of the branch
          curl -s -o /dev/null -w "request build -> HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
