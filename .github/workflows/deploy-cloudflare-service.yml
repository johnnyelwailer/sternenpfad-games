name: Deploy Cloudflare multiplayer service

on:
  workflow_dispatch:
    inputs:
      service_path:
        description: Service directory containing package.json and wrangler.jsonc
        required: false
        default: services/sternenpfad-room
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-service-${{ inputs.service_path || 'default' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVICE_PATH: ${{ inputs.service_path || 'services/sternenpfad-room' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json

      - name: Install service dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci

      - name: Typecheck service
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm run typecheck

      - name: Deploy with Wrangler
        working-directory: ${{ env.SERVICE_PATH }}
        run: npx wrangler deploy --config wrangler.jsonc
