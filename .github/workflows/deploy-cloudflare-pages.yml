name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress is safe for Cloudflare direct uploads (wrangler):
# an interrupted upload is simply replaced by the next deploy. It also
# evicts zombie runners that would otherwise block the queue for hours.
concurrency:
  # v2: renamed so runs never queue behind the zombie run that is
  # stuck holding the old "cloudflare-pages" group
  group: cloudflare-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check deployment secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@4 pages project create sternenpfad-games \
            --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy dist \
            --project-name=sternenpfad-games --branch=main
